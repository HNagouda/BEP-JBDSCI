[project]
name = "bep"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "rdata>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "kaleido>=1.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Builds src/bep as an installable package, so notebooks and tests can import it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bep"]
